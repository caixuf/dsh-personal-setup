packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# ⚠️ minimumReleaseAge 在本机被**主动关闭**（取值 0 = 不拦）。
#
# pnpm 11 默认 1440 分钟（24h），会拦住任何「太新」的包版本。装插件时常撞上，
# 而 `minimumReleaseAgeExclude` **只对「安装新版本」生效，对 lockfile 校验无效**
# —— 于是连 remove_bundle 都会被已豁免的包拦下，报
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION。设 0 才走得通。
#
# 这是**取舍不是配置正确**：换来了能正常增删插件，代价是失去供应链的新鲜度防护。
# 见 intent/dsh.md「pnpm 在本机的三个坑」第 1 条。
minimumReleaseAge: 0
