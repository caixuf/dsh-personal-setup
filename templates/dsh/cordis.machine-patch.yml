# Machine-level patch template — install as `<dsh-home>/cordis.patch.yml`
# (NOT as `profiles/<name>/cordis.patch.yml`).
#
# Why machine-level: DSH Desktop isolates the whole `profiles/` directory into
# `profiles.broken-<ts>` and recreates it when the backend fails to start. A
# profile-level patch is lost in that cleanup; a machine-level one survives.
#
# 顶层必须是 YAML 数组；无条目时保留 []，纯注释（解析为 null）会导致启动失败。
#
# ── 当前挂载：dsh-bot-gateway / dsh-mobile-gateway / dsh-rea ────────────────
# 判据：宿主插件 = package.json 有 `dsh.client` 但**没有** `dsh.bundle`
# （dsh-mobile-gateway / dsh-rea 连 dsh.client 都没有，靠 index.js 直接挂）。
# 装它要两步，缺一不可：
#   1) 本文件复制到 <dsh-home>/cordis.patch.yml（profile 目录**上一级**）
#   2) 包复制一份到 <dsh-home>/node_modules/<包名>/  ← 浏览器半边按此路径解析
# 只做第 1 步不够 —— `dsh add` 只装 profile 那份，机器级 patch 解析不到它。
# 两步都由 scripts/install-dsh.ps1 自动完成（自研两插件从本地源码装）。
#- insert:
    - id: bot-gateway
      name: dsh-bot-gateway
      # 运行时数据默认落 $DSH_HOME/bot-gateway/；一般无需 config
      #
      # 2026-10-18 起本机关闭。原因：Telegram 长轮询持续 ECONNRESET，错误累积
      # 到后来会把 host 一起带崩。
      #
      # 🔴 `disabled` 必须写在这一层，只写 profile 层**无效**。加载顺序是
      #   bundle patches → profile patch → <DSH_HOME>/cordis.patch.yml → overlays
      # （app.asar 内 dsh-app-boot/lib/index.js:1127-1133 `readProfilePatches`），
      # home 层在 profile 层**之后**应用。只禁 profile 层的实测表现是：
      # 配置里写着 disabled: true、`/bot-gateway/` 却照常 200、
      # `plugin_manager list_plugins` 里仍是 enabled=true / fiberPhase=active。
      # 恢复时把两个文件的 disabled 一起改成 false。
      disabled: true

    - id: mobile-gateway
      name: dsh-mobile-gateway
      # DSH 原生移动端网关（dsh-native-mobile）
      # 提供设备配对、单一 WebSocket Mux (/mobile-gateway/remote.mux)、
      # $events 事件流与 $events/result 应答。管理面严格限制回环。
      # 配了公网地址后管理面板才会出二维码：
      # config:
      #   publicBaseUrl: ''

    - id: rea
      name: dsh-rea
      # REA (Reverse Engineer Anything) 逆向工程助手插件
      # 挂载 16 个高价值逆向分析 Tool (APK 分析/反编译/Web Bundle 静态逆向/二进制分析)
