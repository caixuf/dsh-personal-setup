# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# 本文件 = profile 级 patch，装到 <dsh-home>/profiles/<name>/cordis.patch.yml。
# 宿主插件（dsh-bot-gateway / dsh-mobile-gateway / dsh-rea）**不在这里** ——
# 它们挂在机器级 <dsh-home>/cordis.patch.yml，见 templates/dsh/cordis.machine-patch.yml。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    # ⚠️ 这一条是**运行时会话选择**，会话切换模型时会把它写回，不是配置漂移。
    # 模板只放一个「换台新机也一定存在」的基线（buddy 由 dsh-our-free-model 提供）。
    # 本机当前值：provider: deepseek-account / deepseek-flash（2026-10-22）。
    # 注：minimax 正式模型名是 MiniMax-M3.1-Flash（不是 -Preview），见下面 provider 段。
    provider: buddy
    model: deepseek-v4.1-flash
    reasoningEffort: high
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: development
    process: standard
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      minimax-cn:
        apiKeyEnv: MINIMAX_CN_API_KEY
        # 🔴 2026-10-22 按官方 /v1/models 清单 + 实测重写：
        # 正式名是 MiniMax-M3.1-Flash（**没有 -Preview**；旧名已不在官方清单里）。
        # 实测上限：M3.1-Flash / M3 → max_tokens 524288、上下文 ≈1M；
        #           M2.7 / M2.5 系 → max_tokens 196608、上下文更小；
        #           M2.1 / M2 在清单里但实调 404，不配。
        # ⚠️ maxTokens 会被 DSH 当请求默认值下发，写超上游上限必 400。
        models:
          - id: MiniMax-M3.1-Flash
            name: MiniMax-M3.1-Flash
            contextWindow: 1048576
            maxTokens: 524288
            input:
              - text
              - image
          - id: MiniMax-M3
            name: MiniMax-M3
            contextWindow: 1048576
            maxTokens: 524288
            input:
              - text
              - image
          - id: MiniMax-M2.7
            name: MiniMax-M2.7
            contextWindow: 196608
            maxTokens: 196608
            input:
              - text
          - id: MiniMax-M2.7-highspeed
            name: MiniMax-M2.7-highspeed
            contextWindow: 196608
            maxTokens: 196608
            input:
              - text
          - id: MiniMax-M2.5
            name: MiniMax-M2.5
            contextWindow: 196608
            maxTokens: 196608
            input:
              - text
          - id: MiniMax-M2.5-highspeed
            name: MiniMax-M2.5-highspeed
            contextWindow: 196608
            maxTokens: 196608
            input:
              - text
      ccp:
        apiKeyEnv: CCP_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:4000/v1
        models:
          - id: cmdc-deepseek-fast[1m]
            name: cmdc-deepseek-fast[1m]
            contextWindow: 1000000
            maxTokens: 64000
      # ⚠️ 机器本地 provider：本机在用，但换机需要自己的 key（refs: OPENDESIGN_API_KEY）。
      # 没有该 key 时不会报错，只会**静默调不通** —— 不想要就整段删掉。
      opendesign:
        apiKeyEnv: OPENDESIGN_API_KEY
        api: openai-completions
        baseURL: https://amr-link.open-design.ai/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 1000000
            # ⚠️ 2026-10-21 实测：该网关的 max_tokens 上界是 **393216**。
            # 写 1000000 时每次请求都 400：
            #   Invalid max_tokens value, the valid range of max_tokens is [1, 393216]
            # （DSH 会把这个 maxTokens 作为请求默认值下发）
            # 网关 /v1/models 的 metadata.output_budget 只有 128000，但实测 393216 仍被接受。
            # 已实测 393216 + stream + tools 正常返回。
            maxTokens: 393216
            input:
              - text
              - image
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
    fontSize: 17
- id: dsh-eye-care
  name: "@anionex/dsh-eye-care"
  config:
    mode: off
    intensity: balanced
- id: pet
  # 桌宠（dsh-whale-girl-pet）的**运行外观状态**：位置/隐藏是用户手动拖出来的，
  # 属运行时可变量，不要求与模板严格一致。
  # ⚠️ 用户 2026-10-13 关掉桌宠后，该 bundle 已从 dsh.profile.bundles 移除
  # （本机与模板同步移除，2026-10-14），因此这条 override 现在是**惰性**的
  # —— 它指向一个不存在的 entry，不生效。
  # 想重新启用：把 "dsh-whale-girl-pet" 加回 package.json 的
  # dsh.profile.bundles，再把下面 disabled 改成 false。
  disabled: false
  config:
    size: 260
    position: bottom-right
    posY: 529
    hidden: true
- id: remote-web-ui
  name: "@linxin666/dsh-remote-web-ui"
  # 🔴 DSH 0.2.1 起本插件（含 0.4.7）与宿主**冲突**，故整行禁用：
  #   · lanBind: true  → 它把 webserver 写成 host: 0.0.0.0，而 0.2.1 **硬拒绝通配地址**
  #     （webserver 是 required 插件，起不来 → 10 个依赖 webServer 的插件全部挂起
  #      → 启动失败 → 桌面端进入 recovery，sanitizeProfile 把 bundles 砍到 2 个、
  #      并把本文件改名备份。这就是 2026-10-17 那次「插件全消失」的真因）。
  #   · lanBind: false → 它又每次启动把块强制写回 127.0.0.1，覆盖手工维护的绑定。
  # 手机配对页/隧道功能暂时不用；需要时改回 false 前先确认它不再写 0.0.0.0。
  disabled: true
  config:
    lanBind: false

# 手工维护的绑定块（原 remote-web-ui 的 lan-bind 块，0.2.1 后已接管）。
# 🔴 必须保持 loopback，两个原因：
#   ① 0.2.1 的 webserver 硬拒绝 0.0.0.0（通配 = 全网卡监听 = 局域网 RCE 面）；
#   ② dsh-desktop-host 在两处硬编码 127.0.0.1（spawn 时的 --host 参数、给 Electron 的
#      authenticatedUrl），改成局域网 IP 会让本机自己 ECONNREFUSED。
# 手机走局域网/公网靠**外部转发**，不改这里：
#   · 局域网：dsh-lan-bridge.mjs 监听 <lan-ip>:19387 → 127.0.0.1:19387（见 templates/dsh/lan-bridge/）
#   · 公网：frpc 拨出 → VPS Caddy:2444 → FRPS:2443 → 家里 127.0.0.1:19387
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '127.0.0.1'
    port: 19387
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: dsh-sync
  name: "@weibaohui/dsh-sync"
  config:
    sync:
      repoUrl: "https://github.com/caixuf/dsh-sync.git"
      branch: main
      # token 由各机本地填入或走 askpass / credential 服务，切勿直接入库提交明文
      gitEnabled: true
      autoSync: true
      # 🔴 2026-10-17 改 false：启动同步实测耗时 **15.7 秒**（state.json 的 durationMs），
      # 而 dsh-sync 在 bundles 里排第 8、模型 provider 插件（dsh-our-free-model）排第 10，
      # 启动同步把后面的插件全部堵住 → 「模型模块要等十几秒才出现」。
      # 关掉后网关加载从 10.6s 降到 2.2s。定时同步（intervalMinutes）与手动同步不受影响。
      syncOnStartup: false
      # 一天一次（1440 分钟）。用户 2026-10-14 定：30 分钟太勤，
      # 而同步内容（skills/settings/插件清单）本来就不分钟级变化。
      # 覆盖的开关：0 关闭定时；插件每日首个同步会自动打本地快照
      intervalMinutes: 1440
      syncSkills: true
      # 🔴 2026-10-18 改 false：这条路是空转的，而且会给人「设置已备份」的错觉。
      #
      # dsh-sync 的 settings 组固定读 `<DSH_HOME>/settings.yaml`
      # （node_modules/@weibaohui/dsh-sync/src/index.js:708 `from: roots.settingsFile`，
      #  :677 `settingsFile: join(dh, 'settings.yaml')`）。但 0.2.1 起设置已经迁进
      #  profile 的 cordis.patch.yml，settings.yaml 根本不存在 —— copyTree 读失败
      #  走 `catch { return }` 静默跳过，所以 syncSettings=true 从未备份过任何东西
      #  （实测：settings.yaml / settings.yml / settings.json 全都不存在）。
      #
      # 真正的设置源由下面的 plugins 组覆盖（其 includeFiles 含 cordis.patch.yml，
      # 见同文件 :716）。附带好处：settings 组是把明文密钥推上仓库的那条路，
      # 关掉后只剩 plugins 组，暴露面更小。
      syncSettings: false
      syncPlugins: true
      skillsStrategy: union
      settingsStrategy: backup
      pluginsStrategy: backup
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
